name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate required secrets
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::Missing required GitHub Secret: CLOUDFLARE_API_TOKEN"
            echo "Please add it in https://github.com/${GITHUB_REPOSITORY}/settings/secrets/actions"
            exit 1
          fi
          echo "CLOUDFLARE_API_TOKEN is present."

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify wrangler is installed
        run: npx wrangler --version

      - name: Build for Cloudflare Pages
        run: NPM_CONFIG_LEGACY_PEER_DEPS=true npx @cloudflare/next-on-pages
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # ————— AI provider keys (build-time reference, mostly for gift/[asin] static params & build checks) —————
          # Runtime AI inference on Cloudflare Pages reads its env from **Pages → Settings → Environment variables**.
          # These are duplicated here so next-on-pages doesn't warn on unused; production runtime values come from Pages dashboard.
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://gifthive.pages.dev' }}

      - name: Verify build output
        run: |
          test -f ".vercel/output/static/_worker.js/index.js" || { echo "Missing _worker.js/index.js"; exit 1; }
          echo "Build output verified: $(find .vercel/output/static -type f | wc -l) files"

      - name: Deploy to Cloudflare Pages
        run: |
          npx wrangler pages deploy .vercel/output/static \
            --project-name=gifthive \
            --branch=main \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="Deploy ${GITHUB_SHA:0:7}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 43a844e46a9646a8887ebb9672dd1a09

      - name: Wait for deployment to go live
        run: sleep 30

      - name: Ping IndexNow (Bing/Yandex/Naver)
