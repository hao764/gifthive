name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate required secrets
        run: |
          missing=()
          [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && missing+=("CLOUDFLARE_API_TOKEN")
          [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ] && missing+=("CLOUDFLARE_ACCOUNT_ID")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required GitHub Secrets: ${missing[*]}"
            echo "Please add them in https://github.com/${GITHUB_REPOSITORY}/settings/secrets/actions"
            exit 1
          fi
          echo "All required secrets are present."

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify wrangler is installed
        run: npx wrangler --version

      - name: Build for Cloudflare Pages
        run: NPM_CONFIG_LEGACY_PEER_DEPS=true npx @cloudflare/next-on-pages
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Verify build output
        run: |
          test -f ".vercel/output/static/_worker.js/index.js" || { echo "Missing _worker.js/index.js"; exit 1; }
          echo "Build output verified: $(find .vercel/output/static -type f | wc -l) files"

      - name: Deploy to Cloudflare Pages
        run: |
          npx wrangler pages deploy .vercel/output/static \
            --project-name=gifthive \
            --branch=main \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="Deploy ${GITHUB_SHA:0:7}" \
            --verbose
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
